name: Test Provider Bootstrap
description: Prepare local database and storage providers for CI tests with readiness checks

inputs:
  enable-cosmos:
    description: Enable Cosmos emulator readiness and provisioning
    required: false
    default: 'false'
  enable-sqlserver:
    description: Enable SQL Server readiness and database provisioning
    required: false
    default: 'false'
  enable-mysql:
    description: Enable MySQL readiness and database provisioning
    required: false
    default: 'false'
  enable-azurite:
    description: Enable Azurite setup
    required: false
    default: 'false'
  cosmos-endpoint:
    description: Cosmos endpoint
    required: false
    default: 'https://localhost:8081/'
  cosmos-emulator-key:
    description: Cosmos emulator key
    required: false
    default: ''
  cosmos-database-name:
    description: Cosmos database name
    required: false
    default: 'localtests'
  sqlserver-password:
    description: SQL Server SA password
    required: false
    default: ''
  sqlserver-database-names:
    description: Comma-separated SQL Server database names
    required: false
    default: ''
  mysql-root-password:
    description: MySQL root password
    required: false
    default: ''
  mysql-database-names:
    description: Comma-separated MySQL database names
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Wait for Cosmos DB emulator endpoint
      if: ${{ inputs.enable-cosmos == 'true' }}
      shell: bash
      run: |
        echo "Waiting for Cosmos DB emulator certificate endpoint..."
        for i in $(seq 1 60); do
          if curl -ks "${{ inputs.cosmos-endpoint }}_explorer/emulator.pem" > /dev/null 2>&1; then
            echo "Cosmos certificate endpoint ready"
            break
          fi
          sleep 5
        done

        echo "Waiting for Cosmos DB emulator data plane..."
        for i in $(seq 1 60); do
          HTTP_STATUS=$(curl -ks -o /dev/null -w "%{http_code}" "${{ inputs.cosmos-endpoint }}") || true
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "401" ]; then
            echo "Cosmos data plane ready"
            sleep 60
            exit 0
          fi
          sleep 5
        done

        echo "Cosmos emulator did not become ready in time"
        exit 1

    - name: Trust Cosmos DB emulator certificate
      if: ${{ inputs.enable-cosmos == 'true' }}
      shell: bash
      run: |
        curl -ks "${{ inputs.cosmos-endpoint }}_explorer/emulator.pem" > ~/cosmosdb-emulator.crt
        sudo cp ~/cosmosdb-emulator.crt /usr/local/share/ca-certificates/cosmosdb-emulator.crt
        sudo update-ca-certificates

    - name: Provision Cosmos database and containers
      if: ${{ inputs.enable-cosmos == 'true' }}
      shell: bash
      run: |
        mkdir -p /tmp/cosmos-ready
        cd /tmp/cosmos-ready
        dotnet new console --framework net10.0 --force > /dev/null
        dotnet add package Newtonsoft.Json --version 13.0.3 > /dev/null
        dotnet add package Microsoft.Azure.Cosmos --version 3.51.0 > /dev/null
        cat > Program.cs <<'CS'
        using Microsoft.Azure.Cosmos;

        var endpoint = Environment.GetEnvironmentVariable("BOOTSTRAP_COSMOS_ENDPOINT")
            ?? throw new InvalidOperationException("BOOTSTRAP_COSMOS_ENDPOINT is not set.");
        var key = Environment.GetEnvironmentVariable("BOOTSTRAP_COSMOS_KEY")
            ?? throw new InvalidOperationException("BOOTSTRAP_COSMOS_KEY is not set.");
        var databaseName = Environment.GetEnvironmentVariable("BOOTSTRAP_COSMOS_DATABASE")
            ?? throw new InvalidOperationException("BOOTSTRAP_COSMOS_DATABASE is not set.");

        var options = new CosmosClientOptions
        {
            ConnectionMode = ConnectionMode.Gateway,
            RequestTimeout = TimeSpan.FromSeconds(15),
            HttpClientFactory = () => new HttpClient(new HttpClientHandler
            {
                ServerCertificateCustomValidationCallback =
                    HttpClientHandler.DangerousAcceptAnyServerCertificateValidator,
            }),
        };

        using var client = new CosmosClient(endpoint, key, options);

        var requiredContainers = new[]
        {
            new ContainerProperties("Identity", "/id"),
            new ContainerProperties("CosmosCms", "/id"),
            new ContainerProperties("ArticleNumber", "/id"),
            new ContainerProperties("Articles", "/ArticleNumber"),
            new ContainerProperties("ArticleLocks", "/id"),
            new ContainerProperties("ArticleLogs", "/id"),
            new ContainerProperties("ArticleCatalog", "/ArticleNumber"),
            new ContainerProperties("Layouts", "/id"),
            new ContainerProperties("Pages", "/UrlPath"),
            new ContainerProperties("Settings", "/id"),
            new ContainerProperties("Templates", "/id"),
            new ContainerProperties("PageDesignVersions", "/id"),
            new ContainerProperties("AuthorInfo", "/id"),
            new ContainerProperties("Metrics", "/id"),
            new ContainerProperties("MigrationHistory", "/id"),
        };

        for (var attempt = 1; attempt <= 60; attempt++)
        {
            try
            {
                var database = await client.CreateDatabaseIfNotExistsAsync(databaseName);
                await database.Database.ReadAsync();

                foreach (var container in requiredContainers)
                {
                    await database.Database.CreateContainerIfNotExistsAsync(container);
                }

                Console.WriteLine("Cosmos DB emulator is ready and containers are provisioned");
                return;
            }
            catch (Exception ex)
            {
                Console.WriteLine($"Attempt {attempt}/60: {ex.Message}");
                await Task.Delay(TimeSpan.FromSeconds(5));
            }
        }

        throw new Exception("Cosmos DB emulator did not become SDK-ready in time");
        CS
        BOOTSTRAP_COSMOS_ENDPOINT="${{ inputs.cosmos-endpoint }}" BOOTSTRAP_COSMOS_KEY="${{ inputs.cosmos-emulator-key }}" BOOTSTRAP_COSMOS_DATABASE="${{ inputs.cosmos-database-name }}" dotnet run --configuration Release

    - name: Install SQL and MySQL clients
      if: ${{ inputs.enable-sqlserver == 'true' || inputs.enable-mysql == 'true' }}
      shell: bash
      run: |
        curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /usr/share/keyrings/microsoft-prod.gpg > /dev/null
        UBUNTU_VERSION=$(lsb_release -rs)
        curl -fsSL "https://packages.microsoft.com/config/ubuntu/${UBUNTU_VERSION}/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
        sudo apt-get update
        sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 mysql-client

    - name: Wait for SQL Server
      if: ${{ inputs.enable-sqlserver == 'true' }}
      shell: bash
      run: |
        for i in $(seq 1 30); do
          if /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${{ inputs.sqlserver-password }}" -C -Q "SELECT 1" > /dev/null 2>&1; then
            exit 0
          fi
          sleep 5
        done
        echo "SQL Server did not become ready in time"
        exit 1

    - name: Provision SQL Server databases
      if: ${{ inputs.enable-sqlserver == 'true' && inputs.sqlserver-database-names != '' }}
      shell: bash
      run: |
        IFS=',' read -ra DBS <<< "${{ inputs.sqlserver-database-names }}"
        for db in "${DBS[@]}"; do
          clean_db=$(echo "$db" | xargs)
          if [ -n "$clean_db" ]; then
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${{ inputs.sqlserver-password }}" -C -b -Q "IF DB_ID('$clean_db') IS NULL CREATE DATABASE [$clean_db];"
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${{ inputs.sqlserver-password }}" -C -b -d "$clean_db" -Q "SELECT 1;"
          fi
        done

    - name: Wait for MySQL
      if: ${{ inputs.enable-mysql == 'true' }}
      shell: bash
      run: |
        for i in $(seq 1 30); do
          if mysqladmin ping -h 127.0.0.1 -u root --password="${{ inputs.mysql-root-password }}" --silent 2>/dev/null; then
            exit 0
          fi
          sleep 5
        done
        echo "MySQL did not become ready in time"
        exit 1

    - name: Provision MySQL databases
      if: ${{ inputs.enable-mysql == 'true' && inputs.mysql-database-names != '' }}
      shell: bash
      run: |
        IFS=',' read -ra DBS <<< "${{ inputs.mysql-database-names }}"
        for db in "${DBS[@]}"; do
          clean_db=$(echo "$db" | xargs)
          if [ -n "$clean_db" ]; then
            mysql -h 127.0.0.1 -u root --password="${{ inputs.mysql-root-password }}" -e "CREATE DATABASE IF NOT EXISTS $clean_db;"
            mysql -h 127.0.0.1 -u root --password="${{ inputs.mysql-root-password }}" -e "SHOW DATABASES LIKE '$clean_db';"
          fi
        done

    - name: Setup Azurite
      if: ${{ inputs.enable-azurite == 'true' }}
      shell: bash
      run: |
        npm install -g azurite
        mkdir -p ./azurite-data
        azurite --silent --location ./azurite-data &
        sleep 5
