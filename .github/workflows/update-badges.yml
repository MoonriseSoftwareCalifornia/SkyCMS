name: Update Badges From Artifacts

on:
  workflow_dispatch:
    inputs:
      artifact_prefix:
        description: 'Artifact name prefix to locate (default: sky-test-results)'
        required: false
        default: 'sky-test-results'

jobs:
  update-badges:
    name: Update badges from latest test artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Find latest artifact archive URL
        id: find_artifact
        uses: actions/github-script@v6
        with:
          script: |
            const prefix = process.env.INPUT_ARTIFACT_PREFIX || 'sky-test-results'
            const resp = await github.rest.actions.listArtifactsForRepo({ owner: context.repo.owner, repo: context.repo.repo, per_page: 100 })
            const arts = resp.data.artifacts
              .filter(a => a.name && a.name.startsWith(prefix))
              .sort((a,b) => new Date(b.created_at) - new Date(a.created_at))
            if (!arts || arts.length === 0) core.setFailed(`No artifacts found with prefix: ${prefix}`)
            core.setOutput('archive_url', arts[0].archive_download_url)

      - name: Download artifact archive
        run: |
          echo "Downloading artifact from ${{ steps.find_artifact.outputs.archive_url }}"
          curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o artifact.zip "${{ steps.find_artifact.outputs.archive_url }}"
          unzip -q artifact.zip -d artifact

      - name: Prepare TestResults directory
        run: |
          mkdir -p TestResults
          # Copy contents of the artifact into TestResults (artifact may contain a folder)
          shopt -s dotglob || true
          if [ -d artifact/TestResults ]; then
            cp -r artifact/TestResults/* TestResults/ || true
          else
            cp -r artifact/* TestResults/ || true
          fi

      - name: Show TestResults contents
        run: |
          ls -R TestResults || true

      - name: Generate badges (PowerShell)
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -Command "& './.github/scripts/generate-test-badge.ps1'"

      - name: Commit and push badges
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          $files = @()
          if (Test-Path "./test-badge.svg") { $files += 'test-badge.svg' }
          if (Test-Path "./coverage-badge.svg") { $files += 'coverage-badge.svg' }
          if (Test-Path "./coverage-results.json") { $files += 'coverage-results.json' }
          if ($files.Count -gt 0) {
            git add $files
            git diff --staged --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "chore: update badges from artifact [skip ci]"
              git push
            } else {
              Write-Host "No staged changes to commit"
            }
          } else {
            Write-Host "No badge files found to commit"
          }
