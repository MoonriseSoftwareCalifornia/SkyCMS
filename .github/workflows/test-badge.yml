name: Test Badge

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      - name: Run tests and build badge JSON
        run: |
          set -e
          # Run tests and capture output (don't fail the job on test failures so we can publish JSON)
          dotnet test > test-output.txt 2>&1 || true
          cat test-output.txt

          TOTAL=$(grep -Eo 'Total tests: [0-9]+' test-output.txt | head -n1 | grep -Eo '[0-9]+' || echo 0)
          PASSED=$(grep -Eo 'Passed: [0-9]+' test-output.txt | head -n1 | grep -Eo '[0-9]+' || echo 0)
          FAILED=$(grep -Eo 'Failed: [0-9]+' test-output.txt | head -n1 | grep -Eo '[0-9]+' || echo 0)

          if [ -z "$TOTAL" ] || [ "$TOTAL" = "" ]; then TOTAL=0; fi
          if [ -z "$PASSED" ] || [ "$PASSED" = "" ]; then PASSED=0; fi
          if [ -z "$FAILED" ] || [ "$FAILED" = "" ]; then FAILED=0; fi

          COLOR=green
          if [ "$FAILED" -gt 0 ]; then COLOR=red; fi
          MESSAGE="$PASSED/$TOTAL"

          # Emit a JSON document compatible with Shields.io dynamic endpoint
          cat > test-results.json <<EOF
{"schemaVersion":1,"label":"tests","message":"${MESSAGE}","color":"${COLOR}"}
EOF

      - name: Commit test-results.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test-results.json
          git commit -m "Update test badge" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
