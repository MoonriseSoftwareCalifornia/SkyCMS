name: Azure Install Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'InstallScripts/Azure/**'
      - 'Editor/Program.cs'
      - 'Editor/Dockerfile'
      - '.github/workflows/azure-install-validation.yml'

jobs:
  static-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Azure CLI
        shell: bash
        run: az --version

      - name: Validate Bicep templates
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          ./InstallScripts/Azure/validate-bicep.ps1

      - name: Validate template-source contracts
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          ./InstallScripts/Azure/validate-template-contracts.ps1

  optional-whatif:
    runs-on: ubuntu-latest
    needs: static-validation
    if: ${{ github.event_name == 'workflow_dispatch' && vars.AZURE_VALIDATION_RESOURCE_GROUP != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check optional prerequisites
        id: precheck
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -z "$AZURE_CREDENTIALS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "AZURE_CREDENTIALS is not configured; skipping optional what-if validation."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure Login
        if: ${{ steps.precheck.outputs.skip != 'true' }}
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run what-if validation
        if: ${{ steps.precheck.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          ./InstallScripts/Azure/validate-bicep.ps1 -ResourceGroupName '${{ vars.AZURE_VALIDATION_RESOURCE_GROUP }}'
