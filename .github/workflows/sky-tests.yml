name: Sky.Tests

# This workflow runs only when manually triggered
on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Test filter (optional, leave empty for all tests)'
        required: false
        type: string
        default: ''
      
      verbosity:
        description: 'Test output verbosity'
        required: false
        default: 'normal'
        type: choice
        options:
          - quiet
          - minimal
          - normal
          - detailed
          - diagnostic

permissions:
  contents: write

jobs:
  sky-tests:
    name: Run Sky.Tests
    runs-on: ubuntu-latest
    env:
      DOTNET_NO_GLOBAL_JSON: true
      TEST_PROJECT: Tests/Sky.Tests.csproj
      ADDITIONAL_TEST_PROJECT: AspNetCore.Identity.FlexDb.Tests/AspNetCore.Identity.FlexDb.Tests.csproj
      # Local database credentials (not secrets — these are ephemeral containers)
      SA_PASSWORD: "YourStr0ng!Passw0rd"
      MYSQL_ROOT_PASSWORD: "YourStr0ng!Passw0rd"
      COSMOS_EMULATOR_KEY: "C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw=="

    # ---------------------------------------------------------------------------
    # Local database service containers (replace live Azure databases)
    # ---------------------------------------------------------------------------
    services:
      cosmosdb:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
        ports:
          - 8081:8081
          - 10250:10250
          - 10251:10251
          - 10252:10252
          - 10253:10253
          - 10254:10254
          - 10255:10255
        env:
          AZURE_COSMOS_EMULATOR_PARTITION_COUNT: 2
          AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: "false"
          AZURE_COSMOS_EMULATOR_IP_ADDRESS_OVERRIDE: "127.0.0.1"

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourStr0ng!Passw0rd"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStr0ng!Passw0rd' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: "YourStr0ng!Passw0rd"
          MYSQL_DATABASE: "skycmstest"
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    # ---------------------------------------------------------------------------
    # Wait for service containers to be fully ready
    # ---------------------------------------------------------------------------
    - name: Wait for Cosmos DB Emulator
      run: |
        echo "⏳ Waiting for Cosmos DB Emulator to start (this can take 2-3 minutes)..."
        for i in $(seq 1 30); do
          if curl -ks https://localhost:8081/_explorer/emulator.pem > /dev/null 2>&1; then
            echo "✅ Cosmos DB Emulator is ready!"
            exit 0
          fi
          echo "  Attempt $i/30 — waiting 10s..."
          sleep 10
        done
        echo "❌ Cosmos DB Emulator did not start in time"
        exit 1

    - name: Trust Cosmos DB Emulator certificate
      run: |
        curl -ks https://localhost:8081/_explorer/emulator.pem > ~/cosmosdb-emulator.crt
        sudo cp ~/cosmosdb-emulator.crt /usr/local/share/ca-certificates/cosmosdb-emulator.crt
        sudo update-ca-certificates
        echo "✅ Cosmos DB Emulator certificate trusted"

    - name: Install mssql-tools18 and mysql-client
      run: |
        # Import Microsoft GPG key (pipe through tee to handle pre-existing file on ubuntu-latest)
        curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /usr/share/keyrings/microsoft-prod.gpg > /dev/null
        # Register Microsoft repo using signed-by (modern approach for Ubuntu 24.04+)
        UBUNTU_VERSION=$(lsb_release -rs)
        curl -fsSL "https://packages.microsoft.com/config/ubuntu/${UBUNTU_VERSION}/prod.list" | \
          sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
        sudo apt-get update
        sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 mysql-client
        echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH
        echo "✅ mssql-tools18 and mysql-client installed"

    - name: Wait for SQL Server
      run: |
        echo "⏳ Waiting for SQL Server..."
        for i in $(seq 1 12); do
          if /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; then
            echo "✅ SQL Server is ready!"
            exit 0
          fi
          echo "  Attempt $i/12 — waiting 5s..."
          sleep 5
        done
        echo "❌ SQL Server did not start in time"
        exit 1

    - name: Create SQL Server test database
      run: |
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C \
          -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = 'skycmstest') CREATE DATABASE [skycmstest];"
        echo "✅ SQL Server database 'skycmstest' ready"

    - name: Wait for MySQL
      run: |
        echo "⏳ Waiting for MySQL..."
        for i in $(seq 1 12); do
          if mysqladmin ping -h 127.0.0.1 -u root --password="$MYSQL_ROOT_PASSWORD" --silent 2>/dev/null; then
            echo "✅ MySQL is ready!"
            exit 0
          fi
          echo "  Attempt $i/12 — waiting 5s..."
          sleep 5
        done
        echo "❌ MySQL did not start in time"
        exit 1

    - name: Setup Azurite for Tests
      run: |
        npm install -g azurite
        mkdir -p ./azurite-data
        azurite --silent --location ./azurite-data &
        sleep 5
        echo "✅ Azurite started successfully"
        
    - name: Display test configuration
      run: |
        echo "🔧 Test Configuration:"
        echo "  Test Filter: ${{ inputs.test_filter || 'All tests' }}"
        echo "  Verbosity: ${{ inputs.verbosity }}"
        echo "  Cosmos DB: Local Emulator (localhost:8081)"
        echo "  SQL Server: Local Container (localhost:1433)"
        echo "  MySQL: Local Container (localhost:3306)"
        echo "  SQLite: File-based (local)"
        echo "  Blob Storage: Azurite (localhost:10000)"
        echo "  Storage (Azure/S3/R2): Real cloud services via secrets"
        
    - name: Restore dependencies
      run: |
        dotnet restore $TEST_PROJECT
        if [ -f "${ADDITIONAL_TEST_PROJECT}" ]; then
          dotnet restore "${ADDITIONAL_TEST_PROJECT}"
        fi
      
    - name: Build test projects
      run: |
        dotnet build $TEST_PROJECT --configuration Release
        if [ -f "${ADDITIONAL_TEST_PROJECT}" ]; then
          dotnet build "${ADDITIONAL_TEST_PROJECT}" --configuration Release
        fi

    - name: Debug .NET environment
      if: always()
      run: |
        echo "DOTNET_NO_GLOBAL_JSON=$DOTNET_NO_GLOBAL_JSON"
        echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
        dotnet --info || true
        dotnet --version || true
      

    - name: Run Sky.Tests (All tests)
      if: ${{ success() && inputs.test_filter == '' }}
      env:
        DOTNET_NO_GLOBAL_JSON: true
        # CRITICAL: These environment variable names must match what your PowerShell script uploads
        # The double underscores (__) map to nested config in .NET (ConnectionStrings:StorageConnectionString)
        
        ADMINEMAIL: ${{ secrets.ADMINEMAIL }}
        COSMOSIDENTITYDBNAME: "localtests"

        # Storage Connections (cloud — no local equivalent for S3/R2)
        CONNECTIONSTRINGS__STORAGECONNECTIONSTRING: ${{ secrets.CONNECTIONSTRINGS__STORAGECONNECTIONSTRING }}
        CONNECTIONSTRINGS__AZUREBLOBSTORAGECONNECTIONSTRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
        CONNECTIONSTRINGS__AMAZONS3CONNECTIONSTRING: ${{ secrets.CONNECTIONSTRINGS__AMAZONS3CONNECTIONSTRING }}
        CONNECTIONSTRINGS__CLOUDFLARER2CONNECTIONSTRING: ${{ secrets.CONNECTIONSTRINGS__CLOUDFLARER2CONNECTIONSTRING }}
        
        # Database Connections (LOCAL containers — no secrets needed)
        CONNECTIONSTRINGS__COSMOSDB: "AccountEndpoint=https://localhost:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==;Database=localtests"
        CONNECTIONSTRINGS__SQLSERVER: "Server=localhost,1433;Initial Catalog=skycmstest;User ID=sa;Password=YourStr0ng!Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=True;Connection Timeout=30;"
        CONNECTIONSTRINGS__MYSQL: "Server=localhost;Port=3306;Database=skycmstest;uid=root;pwd=YourStr0ng!Passw0rd;"
        CONNECTIONSTRINGS__SQLITE: "Data Source=./skycms_tests.db;"
        
        # CDN Integration Tests
        CDNINTEGRATIONTESTS__CLOUDFLARE__APITOKEN: ${{ secrets.CDNINTEGRATIONTESTS__CLOUDFLARE__APITOKEN }}
        CDNINTEGRATIONTESTS__CLOUDFLARE__ZONEID: ${{ secrets.CDNINTEGRATIONTESTS__CLOUDFLARE__ZONEID }}
        CDNINTEGRATIONTESTS__CLOUDFLARE__TESTDOMAIN: ${{ secrets.CDNINTEGRATIONTESTS__CLOUDFLARE__TESTDOMAIN }}
      run: |
        test_failed=0
        echo "DOTNET_NO_GLOBAL_JSON=$DOTNET_NO_GLOBAL_JSON"
        echo "Running primary tests: $TEST_PROJECT"
        dotnet test $TEST_PROJECT \
          --no-build \
          --configuration Release \
          --collect:"XPlat Code Coverage" \
          --logger "console;verbosity=${{ inputs.verbosity }}" \
          --logger "trx;LogFileName=sky-test-results.trx" \
          --results-directory ./TestResults || test_failed=1

        # If the additional test project exists, run it too (coverage will be merged by ReportGenerator)
        if [ -f "${ADDITIONAL_TEST_PROJECT}" ]; then
          echo "Running additional tests: ${ADDITIONAL_TEST_PROJECT}"
          dotnet test "${ADDITIONAL_TEST_PROJECT}" \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --logger "console;verbosity=${{ inputs.verbosity }}" \
            --logger "trx;LogFileName=sky-test-results-additional.trx" \
            --results-directory ./TestResults || test_failed=1
        else
          echo "Additional test project not found: ${ADDITIONAL_TEST_PROJECT}"
        fi

        # Fail the step after all test projects have run (so coverage is still collected for both)
        if [ $test_failed -ne 0 ]; then
          echo "❌ One or more test projects had failures"
          exit 1
        fi
      
    - name: Run Sky.Tests (Filtered)
      if: ${{ success() && inputs.test_filter != '' }}
      env:
        DOTNET_NO_GLOBAL_JSON: true
        ADMINEMAIL: ${{ secrets.ADMINEMAIL }}
        COSMOSIDENTITYDBNAME: "localtests"

        # Storage Connections
        CONNECTIONSTRINGS__STORAGECONNECTIONSTRING: ${{ secrets.CONNECTIONSTRINGS__STORAGECONNECTIONSTRING }}
        CONNECTIONSTRINGS__AZUREBLOBSTORAGECONNECTIONSTRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
        CONNECTIONSTRINGS__AMAZONS3CONNECTIONSTRING: ${{ secrets.CONNECTIONSTRINGS__AMAZONS3CONNECTIONSTRING }}
        CONNECTIONSTRINGS__CLOUDFLARER2CONNECTIONSTRING: ${{ secrets.CONNECTIONSTRINGS__CLOUDFLARER2CONNECTIONSTRING }}
        
        # Database Connections (LOCAL containers)
        CONNECTIONSTRINGS__COSMOSDB: "AccountEndpoint=https://localhost:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==;Database=localtests"
        CONNECTIONSTRINGS__SQLSERVER: "Server=localhost,1433;Initial Catalog=skycmstest;User ID=sa;Password=YourStr0ng!Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=True;Connection Timeout=30;"
        CONNECTIONSTRINGS__MYSQL: "Server=localhost;Port=3306;Database=skycmstest;uid=root;pwd=YourStr0ng!Passw0rd;"
        CONNECTIONSTRINGS__SQLITE: "Data Source=./skycms_tests.db;"
        
        # CDN Integration Tests
        CDNINTEGRATIONTESTS__CLOUDFLARE__APITOKEN: ${{ secrets.CDNINTEGRATIONTESTS__CLOUDFLARE__APITOKEN }}
        CDNINTEGRATIONTESTS__CLOUDFLARE__ZONEID: ${{ secrets.CDNINTEGRATIONTESTS__CLOUDFLARE__ZONEID }}
        CDNINTEGRATIONTESTS__CLOUDFLARE__TESTDOMAIN: ${{ secrets.CDNINTEGRATIONTESTS__CLOUDFLARE__TESTDOMAIN }}
      run: |
        test_failed=0
        echo "DOTNET_NO_GLOBAL_JSON=$DOTNET_NO_GLOBAL_JSON"
        echo "Running primary tests (filtered): $TEST_PROJECT"
        dotnet test $TEST_PROJECT \
          --no-build \
          --configuration Release \
          --filter "${{ inputs.test_filter }}" \
          --collect:"XPlat Code Coverage" \
          --logger "console;verbosity=${{ inputs.verbosity }}" \
          --logger "trx;LogFileName=sky-test-results.trx" \
          --results-directory ./TestResults || test_failed=1

        if [ -f "${ADDITIONAL_TEST_PROJECT}" ]; then
          echo "Running additional tests (filtered): ${ADDITIONAL_TEST_PROJECT}"
          dotnet test "${ADDITIONAL_TEST_PROJECT}" \
            --no-build \
            --configuration Release \
            --filter "${{ inputs.test_filter }}" \
            --collect:"XPlat Code Coverage" \
            --logger "console;verbosity=${{ inputs.verbosity }}" \
            --logger "trx;LogFileName=sky-test-results-additional.trx" \
            --results-directory ./TestResults || test_failed=1
        else
          echo "Additional test project not found: ${ADDITIONAL_TEST_PROJECT}"
        fi

        if [ $test_failed -ne 0 ]; then
          echo "❌ One or more test projects had failures"
          exit 1
        fi

    - name: Ensure coverage files exist
      if: always()
      run: |
        shopt -s globstar nullglob
        files=(TestResults/**/coverage.*.xml TestResults/**/coverage.json)
        if [ ${#files[@]} -eq 0 ]; then
          echo "No coverage files found in TestResults/"
          ls -R TestResults || true
          exit 1
        else
          echo "Found coverage files:"
          printf "%s\n" "${files[@]}"
        fi

    - name: Install ReportGenerator (local)
      if: always()
      run: |
        mkdir -p ./.toolstmp
        pushd ./.toolstmp
        dotnet tool install --tool-path ../.tools dotnet-reportgenerator-globaltool
        popd
        echo "$GITHUB_WORKSPACE/.tools" >> $GITHUB_PATH
        rm -rf ./.toolstmp || true

    - name: Generate Code Coverage Report
      if: always()
      run: |
        reportgenerator \
          -reports:"TestResults/**/coverage.*.xml;TestResults/**/coverage.json" \
          -targetdir:"TestResults/CoverageReport" \
          -reporttypes:"Html;JsonSummary"

    - name: Parse Test Results and Generate Badge
      if: always()
      shell: pwsh
      run: .\.github\scripts\generate-test-badge.ps1

    - name: Commit and Push Badge
      if: always() && github.ref == 'refs/heads/main'
      shell: pwsh
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        $files = @()
        if (Test-Path "./test-badge.svg") { $files += 'test-badge.svg' }
        if (Test-Path "./coverage-badge.svg") { $files += 'coverage-badge.svg' }
        if (Test-Path "./coverage-results.json") { $files += 'coverage-results.json' }
        if ($files.Count -gt 0) {
          git add $files
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "docs: update test/coverage badges [skip ci]"
            git push
          } else {
            Write-Host "No staged changes to commit"
          }
        } else {
          Write-Host "No badge files found to commit"
        }
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sky-test-results-${{ github.run_number }}
        path: ./TestResults/
        retention-days: 30
        
    - name: Generate test summary
      if: always()
      run: |
        echo "## 🧪 Sky.Tests Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Configuration:**" >> $GITHUB_STEP_SUMMARY
        echo "- Test Filter: \`${{ inputs.test_filter || 'All tests' }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- Verbosity: \`${{ inputs.verbosity }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- Databases: Local containers (Cosmos DB Emulator, SQL Server 2022, MySQL 8, SQLite)" >> $GITHUB_STEP_SUMMARY
        echo "- Storage: Azurite (local) + cloud S3/R2 via secrets" >> $GITHUB_STEP_SUMMARY
        echo "- Status: **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ job.status }}" == "success" ]; then
          echo "### ✅ All tests passed!" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Test Areas Covered:**" >> $GITHUB_STEP_SUMMARY
        echo "- 📝 **Articles & Content:**" >> $GITHUB_STEP_SUMMARY
        echo "  - Article creation, editing, and publishing" >> $GITHUB_STEP_SUMMARY
        echo "  - Title changes and URL redirects" >> $GITHUB_STEP_SUMMARY
        echo "  - Article scheduling" >> $GITHUB_STEP_SUMMARY
        echo "  - Blog rendering" >> $GITHUB_STEP_SUMMARY
        echo "- 🎨 **Templates & Layouts:**" >> $GITHUB_STEP_SUMMARY
        echo "  - Template management" >> $GITHUB_STEP_SUMMARY
        echo "  - Layout import and export" >> $GITHUB_STEP_SUMMARY
        echo "- 📦 **Storage:**" >> $GITHUB_STEP_SUMMARY
        echo "  - Azure Blob Storage" >> $GITHUB_STEP_SUMMARY
        echo "  - Amazon S3" >> $GITHUB_STEP_SUMMARY
        echo "  - Cloudflare R2" >> $GITHUB_STEP_SUMMARY
        echo "- 🗄️ **Databases:**" >> $GITHUB_STEP_SUMMARY
        echo "  - CosmosDB" >> $GITHUB_STEP_SUMMARY
        echo "  - SQL Server" >> $GITHUB_STEP_SUMMARY
        echo "  - MySQL" >> $GITHUB_STEP_SUMMARY
        echo "  - SQLite" >> $GITHUB_STEP_SUMMARY
        echo "- 🌐 **CDN Integration:**" >> $GITHUB_STEP_SUMMARY
        echo "  - Cloudflare CDN" >> $GITHUB_STEP_SUMMARY
        echo "  - Cache purging" >> $GITHUB_STEP_SUMMARY
        echo "- 🔐 **Security & Authentication:**" >> $GITHUB_STEP_SUMMARY
        echo "  - User management" >> $GITHUB_STEP_SUMMARY
        echo "  - Role management" >> $GITHUB_STEP_SUMMARY
        echo "  - Authorization policies" >> $GITHUB_STEP_SUMMARY
        echo "- 🎯 **Feature Tests:**" >> $GITHUB_STEP_SUMMARY
        echo "  - Vertical Slice Architecture handlers" >> $GITHUB_STEP_SUMMARY
        echo "  - Domain event dispatching" >> $GITHUB_STEP_SUMMARY
        echo "  - Catalog service" >> $GITHUB_STEP_SUMMARY
        echo "  - Reserved paths" >> $GITHUB_STEP_SUMMARY
