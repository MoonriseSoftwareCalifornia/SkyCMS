name: Deprecated - Sky.Tests monolithic workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecated:
    name: Deprecated workflow notice
    runs-on: ubuntu-latest

    steps:
      - name: Explain deprecation
        run: |
          echo "This workflow is deprecated."
          echo "Use the purpose-based workflows instead:"
          echo "- tests-pr-required-fast.yml"
          echo "- tests-pr-required-sky.yml"
          echo "- tests-pr-required-flexdb.yml"
          echo "- tests-main-postmerge-full.yml"
          echo "- tests-nightly-full-regression.yml"
          echo "- tests-manual-on-demand-full.yml"

      - name: Add deprecation summary
        run: |
          echo "## Deprecated workflow" >> $GITHUB_STEP_SUMMARY
          echo "The legacy monolithic sky-tests workflow has been replaced by purpose-based workflows." >> $GITHUB_STEP_SUMMARY
          echo "Run one of the new tests-* workflows for PR, post-merge, nightly, or on-demand execution." >> $GITHUB_STEP_SUMMARY
