name: Deploy Docs to CloudFlare R2

on:
  push:
    branches: ["main"]
    paths:
      - 'Docs/**'
      - '.github/workflows/deploy-docs-cloudflare.yml'
  workflow_dispatch:

# Prevent concurrent deployments
concurrency:
  group: "cloudflare-r2-docs"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install MkDocs and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material
      
      - name: Build MkDocs site
        run: |
          python -m mkdocs build --config-file mkdocs.yml --site-dir ./site
      
      - name: Validate links in documentation
        id: linkcheck
        run: |
          python -m pip install --upgrade pip
          pip install linkchecker
          linkchecker ./site --check-extern --timeout=10 --threads=4 --ignore-url='(^|/)sitemap\.xml\.gz$'
        continue-on-error: true

      - name: Link check summary
        if: steps.linkcheck.outcome == 'failure'
        run: |
          echo "### ⚠️ Link validation found issues" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployment continued, but broken links were detected in docs." >> $GITHUB_STEP_SUMMARY
          echo "Review the \"Validate links in documentation\" step logs for exact URLs and referrers." >> $GITHUB_STEP_SUMMARY
      
      - name: Check for broken anchors
        run: |
          python << 'EOF'
          import os
          import re
          from pathlib import Path
          
          broken_anchors = []
          html_files = list(Path('./site').glob('**/*.html'))
          
          for html_file in html_files:
              content = html_file.read_text()
              # Extract all id attributes
              ids = set(re.findall(r'id=["\']([^"\']+)["\']', content))
              # Extract all href anchors (#something)
              hrefs = re.findall(r'href=["\']([^"\']*#[^"\']*)["\']', content)
              
              for href in hrefs:
                  if '#' in href:
                      parts = href.split('#')
                      anchor = parts[-1]
                      # Check if anchor exists in the same file
                      if anchor and anchor not in ids:
                          broken_anchors.append(f"{html_file}: Missing anchor #{anchor}")
          
          if broken_anchors:
              print("❌ Broken anchors found:")
              for item in broken_anchors:
                  print(f"  {item}")
              exit(1)
          else:
              print("✅ All anchors are valid!")
          EOF
      
      - name: Configure AWS CLI for CloudFlare R2
        run: |
          aws configure set aws_access_key_id ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          aws configure set default.region auto
      
      - name: Deploy HTML files to CloudFlare R2
        run: |
          aws s3 sync ./site s3://${{ secrets.R2_BUCKET_NAME }} \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --exclude "*" \
            --include "*.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=3600" \
            --metadata-directive REPLACE
      
      - name: Deploy CSS files to CloudFlare R2
        run: |
          aws s3 sync ./site s3://${{ secrets.R2_BUCKET_NAME }} \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --exclude "*" \
            --include "*.css" \
            --content-type "text/css; charset=utf-8" \
            --cache-control "public, max-age=31536000" \
            --metadata-directive REPLACE \
            --size-only
      
      - name: Deploy JavaScript files to CloudFlare R2
        run: |
          aws s3 sync ./site s3://${{ secrets.R2_BUCKET_NAME }} \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --exclude "*" \
            --include "*.js" \
            --content-type "application/javascript; charset=utf-8" \
            --cache-control "public, max-age=31536000" \
            --metadata-directive REPLACE
      
      - name: Deploy image files to CloudFlare R2
        run: |
          aws s3 sync ./site s3://${{ secrets.R2_BUCKET_NAME }} \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --exclude "*" \
            --include "*.png" \
            --content-type "image/png" \
            --cache-control "public, max-age=31536000"
          
          aws s3 sync ./site s3://${{ secrets.R2_BUCKET_NAME }} \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --exclude "*" \
            --include "*.jpg" --include "*.jpeg" \
            --content-type "image/jpeg" \
            --cache-control "public, max-age=31536000"
          
          aws s3 sync ./site s3://${{ secrets.R2_BUCKET_NAME }} \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --exclude "*" \
            --include "*.svg" \
            --content-type "image/svg+xml" \
            --cache-control "public, max-age=31536000"
          
          aws s3 sync ./site s3://${{ secrets.R2_BUCKET_NAME }} \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --exclude "*" \
            --include "*.gif" \
            --content-type "image/gif" \
            --cache-control "public, max-age=31536000"
          
          aws s3 sync ./site s3://${{ secrets.R2_BUCKET_NAME }} \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --exclude "*" \
            --include "*.webp" \
            --content-type "image/webp" \
            --cache-control "public, max-age=31536000"
      
      - name: Deploy remaining files to CloudFlare R2
        run: |
          aws s3 sync ./site s3://${{ secrets.R2_BUCKET_NAME }} \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --delete \
            --exclude "*.html" --exclude "*.css" --exclude "*.js" \
            --exclude "*.png" --exclude "*.jpg" --exclude "*.jpeg" \
            --exclude "*.svg" --exclude "*.gif" --exclude "*.webp" \
            --cache-control "public, max-age=3600"
      
      - name: Remove stale files from R2
        run: |
          echo "🧹 Removing any stale files from R2 bucket..."
          aws s3 sync ./site s3://${{ secrets.R2_BUCKET_NAME }} \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --delete \
            --quiet
          echo "✅ R2 bucket synchronized (stale files removed)"
      
      - name: Purge CloudFlare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ZONE_ID" ]; then
            curl -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}' \
              --fail-with-body
          else
            echo "CloudFlare cache purge skipped - credentials not configured"
          fi
      
      - name: Deployment summary
        run: |
          echo "### ✅ Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Validation Checks:**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ MkDocs build completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ External links validated" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Internal anchors validated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- R2 Bucket cleared and repopulated: \`${{ secrets.R2_BUCKET_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ env.CLOUDFLARE_ZONE_ID }}" ]; then
            echo "- CDN Cache: ✅ Purged" >> $GITHUB_STEP_SUMMARY
          else
            echo "- CDN Cache: ⏭️ Skipped (no Zone ID configured)" >> $GITHUB_STEP_SUMMARY
          fi
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}